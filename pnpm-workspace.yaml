packages:
  - .

# Dependency overrides (pnpm 10+ reads these from here, not package.json).
# brace-expansion, js-yaml, and tmp force fixed versions of transitive dev-only
# dependencies flagged by OSV-Scanner (GHSA-rgw5-rvv9-x895,
# GHSA-5p4m-2wfm-xmqj, GHSA-h67p-54hq-rp68, GHSA-ph9p-34f9-6g65,
# GHSA-52f5-9888-hmc6).
overrides:
  brace-expansion: ^5.0.9
  flatted: ^3.4.2
  glob: ^11.0.3
  js-yaml: ^4.3.1
  minimatch: ^10.2.4
  tmp: ^0.2.6
  typescript: ^6.0.3
  fast-uri: ^3.1.4
  ws: ^8.19.0

allowBuilds:
  esbuild: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
