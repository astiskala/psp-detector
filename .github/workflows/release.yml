name: Build and Release Extension

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'build.mjs'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.test.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate project (lint, typecheck, unit tests, build)
        run: pnpm run validate

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run integration tests (Playwright)
        run: ./node_modules/.bin/playwright test --config=playwright.config.ts --project=integration-chromium --reporter=line

      - name: Run E2E tests (Playwright)
        run: ./node_modules/.bin/playwright test --config=playwright.config.ts --project=e2e-chromium --reporter=line

      # Rebuild dist/ with the GA4 telemetry credentials baked in. This runs
      # only here — after every test phase — so the credential-free build is
      # what lint/unit/integration/e2e tests exercise (the extension fires no
      # real telemetry during CI). Only the artifact that gets zipped and
      # released below carries the credentials.
      - name: Build with telemetry credentials
        run: pnpm run build
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}

      - name: Archive dist folder
        run: zip -r release.zip dist

      - name: Transfer release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release
          digest-mismatch: error

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          archive='release/release.zip'
          test -f "$archive"
          test "$(unzip -Z1 "$archive" | awk '$0 == "dist/manifest.json" { count++ } END { print count + 0 }')" -eq 1

          version="$(unzip -p "$archive" dist/manifest.json | jq -er '.version | select(type == "string")')"
          if [[ ! "$version" =~ ^3\.([0-9]{4})\.([0-9]{3,4})\.([0-9]{1,4})$ ]]; then
            echo 'Invalid extension version format'
            exit 1
          fi

          mmdd="${BASH_REMATCH[2]}"
          hhmm="${BASH_REMATCH[3]}"
          month=$((10#$mmdd / 100))
          day=$((10#$mmdd % 100))
          hour=$((10#$hhmm / 100))
          minute=$((10#$hhmm % 100))
          if ((month < 1 || month > 12 || day < 1 || day > 31 || hour > 23 || minute > 59)); then
            echo 'Invalid extension version date or time'
            exit 1
          fi

          mv "$archive" "release/psp-detector-$version.zip"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: psp-detector-${{ steps.metadata.outputs.version }}.zip
          body: 'Automated build and release.'
          files: release/psp-detector-${{ steps.metadata.outputs.version }}.zip
          fail_on_unmatched_files: true
          overwrite_files: false
